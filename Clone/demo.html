<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Google</title>

<style>

/* Reset */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* Body */
body{
height:100vh;
display:flex;
flex-direction:column;
background:white;
}

/* Header */
header{
padding:15px 40px;
}

nav ul{
display:flex;
justify-content:flex-end;
list-style:none;
gap:25px;
}

nav ul li a{
text-decoration:none;
color:#333;
font-size:14px;
}

nav ul li a:hover{
text-decoration:underline;
}

/* Main section */
main{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Google logo */
.logo{
width:270px;
margin-bottom:30px;
}

/* Search bar */
.search-bar{
display:flex;
align-items:center;
border:1px solid #dcdcdc;
border-radius:30px;
padding:10px 20px;
width:500px;
box-shadow:0 1px 6px rgba(0,0,0,0.1);
}

.search-bar input{
border:none;
outline:none;
font-size:16px;
width:100%;
}

/* Buttons */
.buttons{
margin-top:25px;
}

.buttons button{
padding:10px 18px;
margin:5px;
border:none;
background:#f8f9fa;
font-size:14px;
cursor:pointer;
border-radius:4px;
}

.buttons button:hover{
border:1px solid #dadce0;
}

/* Footer */
footer{
background:#f2f2f2;
padding:15px;
text-align:center;
font-size:14px;
}

</style>

</head>

<body>

<header>
<nav>
<ul>
<li><a href="/home">Home</a></li>
<li><a href="/about">About</a></li>
<li><a href="/contact">Contact</a></li>
</ul>
</nav>
</header>

<main>

<img class="logo" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png">

<form class="search-bar">
<input type="text" placeholder="Search Google or type a URL">
</form>

<div class="buttons">
<button>Google History</button>
<button>Settings</button>
</div>

</main>

<footer>
<p>Copyright © 2026 | Mini Google Clone</p>
</footer>

</body>
</html>
